name: CI
on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Swift 6
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Validate version registry
        run: make version-check
      - name: Validate privacy manifest
        run: python3 -c "import pathlib, plistlib; plistlib.load(pathlib.Path('App/PrivacyInfo.xcprivacy').open('rb'))"
      - name: Validate audio manifest
        run: make audio-check
      - name: Validate weapon/VFX manifest
        run: make weapon-vfx-check
      - name: Validate gameplay animation manifest
        run: make animation-check
      - name: Validate Suspicion Director rules
        run: make director-check
      - name: Validate City State infrastructure graph
        run: make city-state-check
      - name: Validate Build Engine synergies
        run: make build-engine-check
      - name: Validate Coordination graphs
        run: make coordination-check
      - name: Validate Run Story fact rules
        run: make story-check
      - name: Validate environmental interactables
        run: make interactables-check
      - name: Validate landmark encounters
        run: make landmark-check
      - name: Validate clearing-build proofs
        run: make clearing-builds-check
      - name: Validate city systemic rules
        run: make city-rules-check
      - name: Validate challenge contracts
        run: make challenge-contracts-check
      - name: Validate unlockables
        run: make unlockables-check
      - name: Validate Art QA package gate honesty
        run: make art-qa-check
      - name: Swift core tests
        shell: bash
        run: |
          set +e
          swift test > swift-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '=== SWIFT TEST DIAGNOSTICS ==='
            grep -E 'error:|failed|Issue recorded|Test .* failed' swift-test.log | tail -80 || tail -80 swift-test.log
          fi
          exit "$status"

  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install XcodeGen
        run: brew install xcodegen >/dev/null 2>&1
      - name: Validate visual asset intake
        run: make assets-check
      - name: Validate sprite chroma plates
        run: make sprite-chroma-check
      - name: Validate audio / weapon-vfx / animation / systemic content manifests
        run: |
          make audio-check
          make weapon-vfx-check
          make animation-check
          make director-check
          make city-state-check
          make build-engine-check
          make coordination-check
          make story-check
          make interactables-check
          make landmark-check
          make clearing-builds-check
          make city-rules-check
          make challenge-contracts-check
          make unlockables-check
          make art-qa-check
      - name: Generate project
        run: xcodegen generate >/dev/null
      - name: Boot iPhone Simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(bash scripts/select_available_iphone_simulator.sh)"
          if [ -z "$simulator_id" ]; then
            echo 'No available iPhone simulator found on this runner.'
            exit 70
          fi
          echo "Using available iPhone simulator $simulator_id"
          echo "simulator_id=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b || true
      - name: Test simulator unit
        shell: bash
        run: |
          set +e
          simulator_id="${{ steps.sim.outputs.simulator_id }}"
          xcodebuild \
            -project SurveillanceSurvivor.xcodeproj \
            -scheme SurveillanceSurvivor \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SurveillanceSurvivorTests \
            test > unit-xcodebuild.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '=== UNIT TEST DIAGNOSTICS ==='
            grep -E 'error:|BUILD FAILED|Testing failed|Issue recorded|Expectation failed|Failing tests' unit-xcodebuild.log | tail -120 \
              || tail -120 unit-xcodebuild.log
          fi
          exit "$status"
      - name: Test simulator UI
        shell: bash
        run: |
          set +e
          simulator_id="${{ steps.sim.outputs.simulator_id }}"
          # UI tests need a warm simulator; re-assert booted state.
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          # XCUITest against hybrid SwiftUI/SpriteKit is flaky on cold GitHub
          # Actions hosts. Retry a few times before failing the job.
          status=1
          for attempt in 1 2 3; do
            echo "UI test attempt $attempt/3"
            xcodebuild \
              -project SurveillanceSurvivor.xcodeproj \
              -scheme SurveillanceSurvivor \
              -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              CODE_SIGNING_ALLOWED=NO \
              -only-testing:SurveillanceSurvivorUITests \
              test > ui-xcodebuild.log 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "UI tests passed on attempt $attempt"
              break
            fi
            echo "UI attempt $attempt failed"
            sleep 3
          done
          if [ "$status" -ne 0 ]; then
            echo '=== UI TEST DIAGNOSTICS ==='
            grep -E 'error:|BUILD FAILED|Testing failed|XCTAssert|Assertion|Failing tests|Hierarchy|UI Testing Failure|Missing ' ui-xcodebuild.log | tail -160 \
              || tail -160 ui-xcodebuild.log
          fi
          exit "$status"
      - name: Simulator launch smoke
        shell: bash
        run: |
          set +e
          SIMULATOR_SMOKE_ARTIFACTS="$RUNNER_TEMP/simulator-smoke" \
            bash scripts/run_simulator_smoke.sh > smoke.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '=== SIMULATOR SMOKE DIAGNOSTICS ==='
            tail -120 smoke.log
          else
            echo 'Simulator smoke passed.'
            tail -20 smoke.log
          fi
          exit "$status"
      - name: Restore prior visual history
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/visual-history-cache
          key: visual-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            visual-history-${{ runner.os }}-${{ github.ref_name }}-
      - name: All-city combat and reduced-presentation visual matrix
        shell: bash
        run: |
          set +e
          SIMULATOR_UDID="${{ steps.sim.outputs.simulator_id }}" \
          SIMULATOR_VISUAL_MATRIX_ARTIFACTS="$RUNNER_TEMP/simulator-visual-matrix" \
          VISUAL_HISTORY_BASELINE="$RUNNER_TEMP/visual-history-cache/visual-history-entry.json" \
            make simulator-visual-matrix > visual-matrix.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '=== VISUAL MATRIX DIAGNOSTICS ==='
            tail -160 visual-matrix.log
          else
            echo 'All-city visual matrix passed.'
            tail -30 visual-matrix.log
            echo '=== VISUAL TRIAGE SUMMARY ==='
            cat "$RUNNER_TEMP/simulator-visual-matrix/visual-triage.md"
            echo '=== VISUAL TREND SUMMARY ==='
            cat "$RUNNER_TEMP/simulator-visual-matrix/visual-trend.md"
            mkdir -p "$RUNNER_TEMP/visual-history-cache"
            cp "$RUNNER_TEMP/simulator-visual-matrix/visual-history-entry.json" \
              "$RUNNER_TEMP/visual-history-cache/visual-history-entry.json"
          fi
          exit "$status"
      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-artifacts
          path: |
            ${{ runner.temp }}/simulator-smoke/**
            ${{ runner.temp }}/simulator-visual-matrix/**
            smoke.log
            visual-matrix.log
            unit-xcodebuild.log
            ui-xcodebuild.log
          if-no-files-found: ignore
