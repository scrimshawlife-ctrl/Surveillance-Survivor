name: SurveillanceSurvivor
options:
  bundleIdPrefix: life.zerostate
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
targets:
  SurveillanceCore:
    type: framework
    platform: iOS
    sources:
      - Sources/SurveillanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.zerostate.surveillancesurvivor.core
        GENERATE_INFOPLIST_FILE: YES
  SurveillanceSurvivor:
    type: application
    platform: iOS
    sources:
      - App
      - Game
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # Approved delivery derivatives only. Masters stay out of the bundle.
      # Files are flattened into the bundle root, so the per-directory .gitkeep
      # placeholders must be excluded or they collide with each other.
      - path: Resources/Audio/Delivery
        buildPhase: resources
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: SurveillanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.zerostate.surveillancesurvivor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # Without a launch screen iOS treats the app as legacy and runs it in a scaled
        # compatibility window: on an iPhone 17 Pro the landscape screen is 874x402pt
        # but the app was handed 564x376 and letterboxed, cropping the playfield.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Landscape-only iPhone MVP. Portrait must not remain in the generated Info.plist.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIInterfaceOrientation: UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SurveillanceSurvivorTests
        - SurveillanceSurvivorUITests
  SurveillanceSurvivorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - SurveillanceSurvivorUITests
    dependencies:
      - target: SurveillanceCore
      - target: SurveillanceSurvivor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Simulator CI passes CODE_SIGNING_ALLOWED=NO; device suite signs host + tests.
  SurveillanceSurvivorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/SurveillanceSurvivorUITests
    dependencies:
      - target: SurveillanceSurvivor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.zerostate.surveillancesurvivor.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SurveillanceSurvivor
        # Simulator CI passes CODE_SIGNING_ALLOWED=NO on the xcodebuild line.
        # Physical-device suite requires signing (Automatic + DEVELOPMENT_TEAM).
